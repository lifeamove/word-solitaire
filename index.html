<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Пасьянс «Ассоциации»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --table-1:#14352C; --table-2:#1E4D3E;
    --card:#FBF4E4; --card-edge:#E8DCC2; --ink:#2A2620; --ink-soft:#6B6354;
    --gold-1:#F2C14E; --gold-2:#D99A2B; --gold-ink:#4A3210;
    --coral:#E2725B; --coral-dark:#C75A45;
    --mint:#7FB069; --cream:#FBF4E4; --steel-1:#C9D3DA; --steel-2:#9FB0BC;
    --shadow:0 3px 10px rgba(0,0,0,.35);
    --r:10px;
    --disp:'Comfortaa',system-ui,sans-serif;
    --body:'Nunito',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overscroll-behavior:none}
  body{
    font-family:var(--body);color:var(--cream);
    background:radial-gradient(120% 90% at 50% 0%,var(--table-2),var(--table-1) 70%);
    display:flex;justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app{width:100%;max-width:540px;height:100dvh;max-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;--ch:82px;--colmax:84px}

  .screen{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .3s,transform .3s}
  .screen.hidden{opacity:0;transform:translateY(12px);pointer-events:none}

  /* ---------- map ---------- */
  #mapScreen{align-items:center;overflow-y:auto;padding:24px 20px 40px}
  .logo{font-family:var(--disp);font-weight:700;text-align:center;margin-top:10px}
  .logo .l1{font-size:15px;letter-spacing:.35em;color:var(--gold-1);text-transform:uppercase}
  .logo .l2{font-size:32px;line-height:1.15;margin-top:6px}
  .logo .l3{font-size:13px;color:#BFD8C7;font-weight:500;margin-top:8px;max-width:300px}
  #resumeBtn{margin-top:16px;display:none;border:none;border-radius:13px;padding:12px 22px;cursor:pointer;
    font-family:var(--body);font-weight:800;font-size:14.5px;
    background:linear-gradient(180deg,var(--gold-1),var(--gold-2));color:var(--gold-ink);box-shadow:0 4px 0 #A8761F}
  #resumeBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #A8761F}
  #path{position:relative;width:280px;margin-top:24px}
  #path svg{position:absolute;inset:0;width:100%;height:100%}
  .node{
    position:absolute;width:64px;height:64px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--disp);font-weight:700;font-size:20px;color:var(--gold-ink);
    background:linear-gradient(165deg,var(--gold-1),var(--gold-2));
    border:3px solid #FFE9B3;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s;
  }
  .node:active{transform:scale(.92)}
  .node.locked{background:#2C5547;border-color:#3C6B5A;color:#7FA391;cursor:default}
  .node .stars{font-size:9px;letter-spacing:1px;margin-top:1px}
  .node-label{position:absolute;width:96px;left:50%;transform:translateX(-50%);top:68px;text-align:center;font-size:10.5px;color:#BFD8C7;font-weight:700}
  .map-foot{margin-top:18px;font-size:11.5px;color:#7FA391;text-align:center;line-height:1.6}
  .map-btns{display:flex;gap:10px;margin-top:16px}
  #dailyCard{
    margin-top:16px;width:min(88%,310px);
    background:rgba(0,0,0,.28);border:1.5px solid rgba(242,193,78,.45);
    border-radius:14px;padding:10px 12px;
    display:flex;align-items:center;gap:10px;justify-content:space-between;
  }
  #dailyCard .dc-t{font-family:var(--disp);font-weight:700;font-size:14px}
  #dailyCard .dc-d{font-size:11px;color:#BFD8C7;margin-top:2px}
  #dailyCard .dc-btn{
    border:none;border-radius:10px;padding:9px 14px;font-weight:800;font-family:var(--body);font-size:13px;
    background:linear-gradient(180deg,var(--gold-1),var(--gold-2));color:var(--gold-ink);
    box-shadow:0 3px 0 #A8761F;cursor:pointer;white-space:nowrap;
  }
  #dailyCard .dc-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #A8761F}
  #dailyCard .dc-btn.done{background:linear-gradient(180deg,#8FBF77,var(--mint));color:#1E3B16;box-shadow:0 3px 0 #4F7A40}
  .chapter-banner{
    position:absolute;left:-12px;right:-12px;height:38px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-weight:700;font-size:13px;color:var(--gold-1);
    background:linear-gradient(90deg,transparent,rgba(242,193,78,.14),transparent);
    border-top:1px dashed rgba(242,193,78,.35);border-bottom:1px dashed rgba(242,193,78,.35);
  }

  /* ---------- game ---------- */
  #gameScreen{padding:8px 8px 6px}
  .hud{display:flex;align-items:center;gap:7px;padding:2px 2px 7px}
  .hud .lvl{font-family:var(--disp);font-weight:700;font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ribbon{
    background:linear-gradient(180deg,#8FBF77,var(--mint));color:#1E3B16;
    border-radius:7px;padding:4px 12px 5px;font-weight:800;font-size:14px;
    display:flex;flex-direction:column;align-items:center;line-height:1;gap:2px;
    box-shadow:0 3px 0 #4F7A40;
  }
  .ribbon .t{font-size:8px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
  .ribbon.low{background:linear-gradient(180deg,#F09180,var(--coral));color:#5B190E;box-shadow:0 3px 0 #9E4434}
  .icon-btn{width:35px;height:35px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.28);color:var(--cream);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
  .icon-btn:active{transform:scale(.9)}
  .icon-btn:disabled{opacity:.35}

  /* ---------- верхний ряд: категории + колода ---------- */
  #topRow{display:flex;gap:6px;justify-content:center;align-items:flex-start}
  .fslot,.pile{
    flex:1;max-width:calc(var(--colmax) + 8px);border-radius:var(--r);
    border:2px dashed rgba(255,255,255,.18);
    height:calc(var(--ch) + 24px);position:relative;
    transition:border-color .15s,background .15s,transform .15s;
  }
  .fslot .tab{
    position:absolute;top:-1px;left:6%;right:6%;height:20px;z-index:25;
    background:linear-gradient(180deg,#FFD978,var(--gold-2));
    border:1.5px solid #FFF1C9;border-radius:7px 7px 4px 4px;
    color:var(--gold-ink);font-family:var(--disp);font-weight:700;
    font-size:calc(var(--ch)*0.115);display:flex;align-items:center;justify-content:center;
    white-space:nowrap;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,.3);
  }
  .fslot .cardArea{position:absolute;top:22px;left:0;right:0;bottom:0}
  .fslot .cardArea .card{height:auto;top:0;bottom:0}
  .fslot .prog{
    position:absolute;top:24px;right:3px;z-index:26;
    background:rgba(42,38,32,.78);color:#FFE9B3;font-size:calc(var(--ch)*0.105);
    font-weight:800;border-radius:6px;padding:2px 5px;
  }
  .fslot .empty-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:800;color:#7FA391;text-align:center}
  .fslot .empty-hint .e{font-size:20px;opacity:.7}
  .fslot.full-soon .tab{box-shadow:0 0 10px rgba(242,193,78,.9)}
  .pile{cursor:pointer}
  .pile .zl{position:absolute;top:-1px;left:0;right:0;text-align:center;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#6E9682;font-weight:800}
  .pile .pcard{position:absolute;top:13px;left:0;right:0;bottom:3px}
  .pile .pcard .card{height:auto;top:0;bottom:0}
  .pile .cnt{position:absolute;bottom:-4px;right:-3px;background:var(--coral);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:2px 6px;z-index:30}
  .pile .recyc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7FA391;font-size:20px;gap:2px}
  .pile .recyc span{font-size:8.5px;font-weight:800;letter-spacing:.08em}

  /* ---------- стол ---------- */
  #tableau{flex:1;display:flex;gap:5px;justify-content:center;align-items:flex-start;padding:8px 0 4px;min-height:0}
  .tcol{flex:1;max-width:var(--colmax);position:relative;height:100%;border-radius:var(--r)}
  .tcol .tplace{
    position:absolute;top:0;left:0;right:0;height:var(--ch);border-radius:var(--r);
    border:2px dashed rgba(255,255,255,.15);
  }

  /* ---------- карты ---------- */
  .card{
    position:absolute;left:0;width:100%;height:var(--ch);border-radius:var(--r);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    text-align:center;padding:4px 4px;box-shadow:var(--shadow);
    transition:transform .25s cubic-bezier(.2,.8,.3,1.1), top .22s ease;
    will-change:transform;touch-action:none;-webkit-touch-callout:none;
  }
  .card.word{background:linear-gradient(180deg,#FFFDF6,var(--card));border:1.5px solid var(--card-edge);color:var(--ink)}
  .card.word .strip{position:absolute;top:0;left:0;right:0;height:5px;border-radius:var(--r) var(--r) 0 0}
  .card.gold{
    background:linear-gradient(165deg,#FFD978,var(--gold-1) 40%,var(--gold-2));
    border:2px solid #FFF1C9;color:var(--gold-ink);box-shadow:0 3px 12px rgba(217,154,43,.5);
  }
  .card.gold::after{content:"";position:absolute;inset:3px;border:1.5px dashed rgba(74,50,16,.45);border-radius:7px;pointer-events:none}
  .card.key{background:linear-gradient(165deg,#E8EEF2,var(--steel-1) 45%,var(--steel-2));border:2px solid #F2F7FA;color:#33424E}
  .card.joker{background:linear-gradient(165deg,#EFE0FA,#CBA8E9 45%,#A87BD0);border:2px solid #F5EBFD;color:#4B2A6B}
  .card.joker::after{content:"";position:absolute;inset:3px;border:1.5px dashed rgba(75,42,107,.4);border-radius:7px;pointer-events:none}
  .card .em{font-size:calc(var(--ch)*0.22);line-height:1}
  .card .tx{font-weight:800;font-size:calc(var(--ch)*0.145);line-height:1.06;word-break:break-word}
  .card.gold .tx{font-family:var(--disp);font-size:calc(var(--ch)*0.125)}
  .card.gold .em{font-size:calc(var(--ch)*0.2)}
  .card.back{
    background:linear-gradient(155deg,#27604E,#1B4537);border:1.5px solid #346B58;
    background-image:radial-gradient(circle at 50% 50%, rgba(242,193,78,.16) 1.5px, transparent 1.6px);
    background-size:11px 11px;
  }
  .card.back .badge{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    font-size:calc(var(--ch)*0.17);line-height:1;
    background:rgba(20,53,44,.85);border:1.5px solid rgba(242,193,78,.5);
    border-radius:99px;padding:3px 7px;
  }
  /* в каскаде у рубашек виден только верхний край — бейдж прижимаем к нему */
  .card.back.thin .badge{top:4px;transform:translate(-50%,0);font-size:calc(var(--ch)*0.13);padding:1px 6px}
  .card.under{justify-content:flex-start;padding-top:4px}
  .card.under .tx{font-size:calc(var(--ch)*0.125)}
  .card.under .em{display:none}
  .card .lockov{position:absolute;inset:0;border-radius:var(--r);background:rgba(30,40,38,.5);display:flex;align-items:center;justify-content:center;font-size:calc(var(--ch)*0.3);z-index:5}
  .card.lockedc{filter:saturate(.5)}
  .card.tappable{cursor:grab}

  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .card.shake,.pile.shake{animation:shake .3s ease}
  @keyframes pulse{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 5px rgba(242,193,78,.55)}}
  .card.hinted,.pile.hinted{animation:pulse 1s ease 2}
  @keyframes done{0%{transform:scale(1) rotate(0)}40%{transform:scale(1.12) rotate(-3deg)}100%{transform:scale(0) rotate(8deg);opacity:0}}
  .fslot.completing .card,.fslot.completing .tab,.fslot.completing .prog{animation:done .6s ease forwards}
  .stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;color:var(--mint);font-size:13px;transform:rotate(-10deg);opacity:0;pointer-events:none;z-index:40}
  @keyframes stampIn{0%{opacity:0;transform:rotate(-10deg) scale(2)}50%{opacity:1;transform:rotate(-10deg) scale(.95)}100%{opacity:0;transform:rotate(-10deg) scale(1)}}
  .stamp.show{animation:stampIn 1s ease forwards}

  .drop-ok{border-style:solid!important;border-color:var(--gold-1)!important;background:rgba(242,193,78,.12)}
  @keyframes flashSlot{0%,100%{background:rgba(242,193,78,.05)}50%{background:rgba(242,193,78,.3)}}
  .drop-flash{border-style:solid!important;border-color:var(--gold-1)!important;animation:flashSlot .55s ease 2}
  .card.drop-flash{animation:pulse 1s ease 2}
  .drop-hot{background:rgba(242,193,78,.3)!important;transform:scale(1.03)}
  .card.drop-hot{transform:scale(1.06)}
  .tcol.drop-ok,.tcol.drop-flash{background:rgba(242,193,78,.07)}
  .tcol.drop-hot{background:rgba(242,193,78,.18)!important}

  #dragLayer{position:absolute;z-index:100;pointer-events:none}
  #dragLayer .card{position:absolute;transition:none;box-shadow:0 12px 26px rgba(0,0,0,.55);transform:rotate(2deg) scale(1.06)}

  #overlay{position:absolute;inset:0;background:rgba(10,26,21,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200}
  #overlay.show{opacity:1;pointer-events:auto}
  .modal{width:min(86%,330px);background:linear-gradient(180deg,#FFFDF6,var(--card));color:var(--ink);border-radius:18px;padding:24px 20px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.5);border:2px solid var(--card-edge);transform:scale(.9);transition:transform .25s}
  #overlay.show .modal{transform:scale(1)}
  .modal h2{font-family:var(--disp);font-size:20px;margin-bottom:6px}
  .modal .stars-big{font-size:30px;letter-spacing:4px;margin:6px 0 2px}
  .modal p{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:14px}
  .btn{display:block;width:100%;border:none;border-radius:13px;padding:13px;cursor:pointer;font-family:var(--body);font-weight:800;font-size:15px;margin-top:9px;background:linear-gradient(180deg,var(--coral),var(--coral-dark));color:#fff;box-shadow:0 4px 0 #9E4434}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #9E4434}
  .btn.ghost{background:none;box-shadow:none;color:var(--ink-soft);font-weight:700;padding:9px}
  .btn.gold{background:linear-gradient(180deg,var(--gold-1),var(--gold-2));color:var(--gold-ink);box-shadow:0 4px 0 #A8761F}
  .btn.gold:active{box-shadow:0 2px 0 #A8761F}
  .tut{font-size:13px;color:var(--ink);text-align:left;line-height:1.5;margin-bottom:4px}
  .tut b{color:var(--coral-dark)}
  .tut .row{display:flex;gap:9px;margin-bottom:10px;align-items:flex-start}
  .tut .n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--gold-1);color:var(--gold-ink);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}

  .toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:rgba(0,0,0,.8);color:#fff;font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:300;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (min-width:700px){
    .logo .l2{font-size:42px}.logo .l3{font-size:15px;max-width:380px}
    #path{transform:scale(1.25);transform-origin:top center;margin-bottom:14%}
    .map-foot{font-size:13px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<div id="app">

  <div class="screen" id="mapScreen">
    <div class="logo">
      <div class="l1">Пасьянс</div>
      <div class="l2">Ассоциации:<br>Путешествие</div>
      <div class="l3">Разгадай, что связывает слова, и собери их под золотые карты — как масти в пасьянсе, только умнее.</div>
    </div>
    <button id="resumeBtn">▶ Продолжить уровень</button>
    <div id="dailyCard"></div>
    <div id="path"></div>
    <div class="map-btns">
      <button class="icon-btn" id="soundBtn">🔊</button>
      <button class="icon-btn" id="statsBtn">📊</button>
    </div>
    <div class="map-foot">Перетаскивай карты по столу и в категории<br>Тап по колоде — взять карту</div>
  </div>

  <div class="screen hidden" id="gameScreen">
    <div class="hud">
      <button class="icon-btn" id="btnHome">🗺</button>
      <div class="lvl" id="lvlName"></div>
      <div class="ribbon" id="movesPill"><span class="t">Ходы</span><span id="movesLeft"></span></div>
      <button class="icon-btn" id="btnHint">💡</button>
      <button class="icon-btn" id="btnUndo">↩</button>
      <button class="icon-btn" id="btnRestart">⟳</button>
    </div>
    <div id="topRow"></div>
    <div id="tableau"></div>
  </div>

  <div id="overlay"><div class="modal" id="modalBox"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ===================================================== */
/* ====== БАНК АССОЦИАЦИЙ (категория → намёки) ========= */
/* ===================================================== */
const BANK = {
  'Бессонница':['🌙',['Подушка','Овцы','Полночь','Кофе','Будильник']],
  'Цирк':      ['🎪',['Клоун','Арена','Жонглёр','Купол','Фокус']],
  'Зевс':      ['⚡',['Молния','Олимп','Гера','Орёл','Титан']],
  'Пираты':    ['🏴‍☠️',['Абордаж','Клад','Попугай','Ром','Сабля']],
  'Шерлок':    ['🔍',['Лупа','Трубка','Ватсон','Дедукция','Мориарти']],
  'Египет':    ['🐪',['Пирамида','Сфинкс','Нил','Фараон','Папирус']],
  'Шахматы':   ['♟',['Ферзь','Гамбит','Рокировка','Цейтнот','Эндшпиль']],
  'Осень':     ['🍂',['Листопад','Слякоть','Урожай','Хандра','Заморозки']],
  'Свадьба':   ['💍',['Фата','Букет','Тамада','Выкуп','Загс']],
  'Космонавт': ['🚀',['Скафандр','Невесомость','Байконур','Гагарин','Орбита']],
  'Вампир':    ['🧛',['Клык','Чеснок','Гроб','Осина','Дракула']],
  'Театр':     ['🎭',['Кулисы','Антракт','Суфлёр','Бис','Премьера']],
  'Алхимия':   ['⚗️',['Эликсир','Тигель','Колба','Ртуть','Зелье']],
  'Самурай':   ['🗡',['Катана','Сёгун','Кимоно','Бусидо','Харакири']],
  'Рыцарь':    ['🛡',['Турнир','Латы','Оруженосец','Грааль','Копьё']],
  'Сон':       ['💤',['Дрёма','Колыбельная','Сновидение','Храп','Соня']],
  'Пекарня':   ['🥐',['Багет','Дрожжи','Мука','Круассан','Закваска']],
  'Гадалка':   ['🔮',['Таро','Хиромантия','Ладонь','Предсказание','Шар']],
  'Гроза':     ['⛈',['Гром','Ливень','Раскат','Зарница','Громоотвод']],
  'Библиотека':['📚',['Тишина','Формуляр','Стеллаж','Переплёт','Читальня']],
  'Мёд':       ['🍯',['Пасека','Улей','Соты','Воск','Прополис']],

    [4,4,5,5,5,4,5,5,6,6],

      locks:c===0?0:(c===1?(j>=6?1:0):Math.min(3,(c>=3?2:1)+(boss?1:0))),

}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=s=>document.querySelector(s);

function shuf(a,rnd){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

let audioCtx=null;
function beep(freq=520,dur=.07,type='triangle',vol=.12){

    o.type=type;o.frequency.value=freq;g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

function pickCategories(cfg,rnd){
  const chosen=[],used=new Set();
  const ok=n=>BANK[n]&&!chosen.includes(n)&&!BANK[n][1].some(w=>used.has(w));
  const add=n=>{chosen.push(n);BANK[n][1].forEach(w=>used.add(w))};
  if(cfg.trap){
    const pairs=shuf(TRAP_PAIRS.slice(),rnd);
    let got=false;
    for(const [a,b] of pairs){ /* сперва ловушки, касающиеся темы главы */
      if(cfg.pool&&!cfg.pool.includes(a)&&!cfg.pool.includes(b))continue;
      if(ok(a)&&ok(b)){add(a);add(b);got=true;break}
    }
    if(!got)for(const [a,b] of pairs){if(ok(a)&&ok(b)){add(a);add(b);break}}
  }
  const order=[...shuf((cfg.pool||[]).slice(),rnd),...shuf(Object.keys(BANK),rnd)];
  for(const n of order){
    if(chosen.length>=cfg.nCats)break;
    if(ok(n))add(n);
  }
  return shuf(chosen.slice(0,cfg.nCats),rnd);
}
function buildDef(cfg,seedShift){
  const rnd=mulberry32(cfg.seed+seedShift*9973);
  const catNames=pickCategories(cfg,rnd);
  if(catNames.length<cfg.nCats)return null;
  const cats=catNames.map(n=>({n,e:BANK[n][0],w:shuf(BANK[n][1].slice(),rnd).slice(0,cfg.wpc)}));
  let id=0;
  const golds=[],words=[];
  cats.forEach((c,ci)=>{
    golds.push({id:'g'+(id++),type:'gold',cat:ci,text:c.n,em:c.e});
    c.w.forEach(t=>words.push({id:'w'+(id++),type:'word',cat:ci,text:t}));
  });
  const keys=[];for(let k=0;k<cfg.locks;k++)keys.push({id:'k'+(id++),type:'key',text:'Ключ',em:'🗝'});
  const jokers=[];for(let j=0;j<(cfg.jokers||0);j++)jokers.push({id:'j'+(id++),type:'joker',text:'Джокер',em:'🃏'});
  const wpool=shuf(words.slice(),rnd);
  const stock=wpool.slice(0,Math.min(cfg.stock,wpool.length));
  const tableWords=wpool.slice(stock.length);
  const tdeck=shuf([...golds,...tableWords,...keys,...jokers],rnd);
  const stacks=Array.from({length:cfg.stacks},()=>[]);
  tdeck.forEach((c,i)=>stacks[i%cfg.stacks].push(c));
  if(!stacks.some(st=>st.length&&st[st.length-1].type==='gold'))return null;
  /* замки: на словах не на вершинах */
  const lockedIds=[];
  const lockCand=[];
  stacks.forEach(st=>st.forEach((c,i)=>{if(c.type==='word'&&i<st.length-1)lockCand.push(c.id)}));
  shuf(lockCand,rnd);
  for(let k=0;k<cfg.locks&&k<lockCand.length;k++)lockedIds.push(lockCand[k]);
  /* открытые карты */
  stacks.forEach(st=>{
    st.forEach((c,i)=>{c.up=i>=st.length-cfg.faceUp});
  });
  return {cats,stacks,stock,lockedIds,fS:cfg.fS,faceUp:cfg.faceUp,strips:!!cfg.strips,wpc:cfg.wpc};
}

/* солвер: рулетка действий по правилам стола */
function solveRollouts(def,tries,cap){
  let best=null;
  const nCats=def.cats.length;
  for(let t=0;t<tries;t++){
    const rnd=mulberry32(7777+t*131);
    const stacks=def.stacks.map(s=>s.slice());
    let stock=def.stock.slice(),waste=[];
    const found=Array.from({length:def.fS},()=>[]);
    const locked=new Set(def.lockedIds);
    let completed=0,moves=0,iters=0;
    const limit=best?best-1:cap;
    while(iters++<cap*3&&moves<limit&&completed<nCats){
      const acts=[];
      const openF=ci=>found.findIndex(f=>f.length&&f[0].cat===ci);
      const emptyF=()=>found.findIndex(f=>!f.length);
      const lockedTopCols=[];
      stacks.forEach((st,si)=>{const c=st[st.length-1];if(c&&locked.has(c.id))lockedTopCols.push(si)});
      /* источники: вершины колонок (серии) и сброс */
      stacks.forEach((st,si)=>{
        if(!st.length)return;
        const top=st[st.length-1];
        if(locked.has(top.id))return;
        if(top.type==='word'){
          let n=1;for(let k=st.length-2;k>=0&&st[k].type==='word'&&st[k].cat===top.cat&&!locked.has(st[k].id);k--)n++;
          const f=openF(top.cat);
          if(f>=0)acts.push([100,()=>found[f].push(...st.splice(st.length-n))]);
          /* строгий режим: только на слово той же категории или пустую колонку */
          stacks.forEach((d,di)=>{
            if(di===si)return;
            const dt=d[d.length-1];
            if(!d.length){if(n<st.length)acts.push([10,()=>d.push(...st.splice(st.length-n))]);return}
            if(locked.has(dt.id))return;
            if(dt.type==='word'&&dt.cat===top.cat)acts.push([26,()=>d.push(...st.splice(st.length-n))]);
          });
        }else if(top.type==='gold'){
          const f=emptyF();
          if(f>=0)acts.push([60,()=>found[f].push(st.pop())]);
          stacks.forEach((d,di)=>{if(di!==si&&!d.length&&st.length>1)acts.push([9,()=>d.push(st.pop())])});
        }else if(top.type==='key'){
          lockedTopCols.forEach(li=>{if(li!==si)acts.push([85,()=>{locked.delete(stacks[li][stacks[li].length-1].id);st.pop()}])});
          stacks.forEach((d,di)=>{if(di!==si&&!d.length&&st.length>1)acts.push([6,()=>d.push(st.pop())])});
        }else{ /* джокер */
          found.forEach(f=>{if(f.length)acts.push([70,()=>f.push(st.pop())])});
          stacks.forEach((d,di)=>{if(di!==si&&!d.length&&st.length>1)acts.push([4,()=>d.push(st.pop())])});
        }
      });
      if(waste.length){
        const c=waste[waste.length-1];
        if(c.type==='word'){
          const f=openF(c.cat);
          if(f>=0)acts.push([95,()=>found[f].push(waste.pop())]);
          stacks.forEach(d=>{
            const dt=d[d.length-1];
            if(!d.length){acts.push([10,()=>d.push(waste.pop())]);return}
            if(locked.has(dt.id))return;
            if(dt.type==='word'&&dt.cat===c.cat)acts.push([24,()=>d.push(waste.pop())]);
          });
        }
      }
      if(stock.length)acts.push([22,()=>waste.push(stock.pop()),true]);
      else if(waste.length>1)acts.push([8,()=>{stock=waste.reverse();waste=[]},true]);
      if(!acts.length)break;
      let sum=0;for(const a of acts)sum+=a[0];
      let r=rnd()*sum,pick=acts[0];
      for(const a of acts){r-=a[0];if(r<=0){pick=a;break}}
      pick[1]();if(!pick[2])moves++;
      found.forEach((f,fi)=>{if(f.length===1+def.wpc){completed++;found[fi]=[]}});
    }
    if(completed===nCats){if(best===null||moves<best)best=moves}
  }
  return best;
}
function generateLevel(cfg){
  for(let shift=0;shift<50;shift++){
    const def=buildDef(cfg,shift);
    if(!def)continue;
    const min=solveRollouts(def,420,300);
    if(min!==null){
      def.moves=Math.ceil(min*1.6)+3;
      def.parMoves=min;
      return def;
    }
  }
  const def=buildDef(cfg,999)||buildDef({...cfg,locks:0},1001);
  def.moves=Math.ceil((cfg.nCats*(cfg.wpc+1)+cfg.stock)*2.8);
  return def;
}

const catSize=()=>1+DEF.wpc;

function openFoundationFor(ci){return S.found.findIndex(f=>f.length&&f[0].cat===ci)}

function srcArr(src){return src.zone==='stack'?S.stacks[src.idx]:S.waste}
function getDragSet(src){
  const arr=srcArr(src);if(!arr.length)return[];
  const top=arr[arr.length-1];
  if(isLocked(top))return[];
  if(src.zone==='stack'&&top.type==='word'){
    const run=[];
    for(let k=arr.length-1;k>=0&&arr[k].type==='word'&&arr[k].cat===top.cat&&!S.locked.includes(arr[k].id);k--)run.unshift(arr[k]);
    return run;
  }
  return [top];
}
function colCanAccept(card,di,src){
  if(src.zone==='stack'&&src.idx===di)return false;
  const d=S.stacks[di];
  if(!d.length)return true;
  const dt=d[d.length-1];
  if(isLocked(dt))return false;
  if(dt.type==='gold')return false;
  if(card.type==='gold')return false;            /* золото — только пустая колонка или фундамент */
  if(card.type==='key'||card.type==='joker')return false; /* ключ/джокер — только пустая колонка или спец-цель */
  /* СТРОГИЙ РЕЖИМ: слово ложится только на слово своей категории */
  return dt.type==='word'&&dt.cat===card.cat;
}
/* что ПОДСВЕЧИВАЕМ при перетаскивании: без спойлеров —
   для слова показываем все открытые категории и пустые колонки,
   а настоящая проверка совпадения происходит только при сбросе */
function computeShowTargets(card,src){
  const t=[];
  const F=$('#topRow').querySelectorAll('.fslot');
  const C=$('#tableau').children;
  const emptyCols=()=>S.stacks.forEach((d,i)=>{if(!d.length&&!(src.zone==='stack'&&src.idx===i))t.push({zone:'stack',idx:i,el:C[i]})});
  if(card.type==='gold'){
    S.found.forEach((f,i)=>{if(!f.length)t.push({zone:'found',idx:i,el:F[i]})});
    emptyCols();
  }else if(card.type==='key'){
    S.stacks.forEach((st,i)=>{
      const c=st[st.length-1];
      if(c&&isLocked(c)&&!(src.zone==='stack'&&src.idx===i)){
        const e=document.querySelector(`[data-id="${c.id}"]`);
        if(e)t.push({zone:'lock',idx:i,el:e});
      }
    });
    emptyCols();
  }else{ /* слово или джокер */
    S.found.forEach((f,i)=>{if(f.length)t.push({zone:'found',idx:i,el:F[i]})});
    emptyCols();
  }
  return t;
}
function computeTargets(card,src){
  const t=[];
  const F=$('#topRow').querySelectorAll('.fslot');
  const C=$('#tableau').children;
  if(card.type==='gold'){
    S.found.forEach((f,i)=>{if(!f.length)t.push({zone:'found',idx:i,el:F[i]})});
    S.stacks.forEach((d,i)=>{if(!d.length&&!(src.zone==='stack'&&src.idx===i))t.push({zone:'stack',idx:i,el:C[i]})});
  }else if(card.type==='word'){
    S.found.forEach((f,i)=>{if(f.length&&f[0].cat===card.cat)t.push({zone:'found',idx:i,el:F[i]})});
    S.stacks.forEach((d,i)=>{if(colCanAccept(card,i,src))t.push({zone:'stack',idx:i,el:C[i]})});
  }else if(card.type==='joker'){
    S.found.forEach((f,i)=>{if(f.length)t.push({zone:'found',idx:i,el:F[i]})});
    S.stacks.forEach((d,i)=>{if(colCanAccept(card,i,src))t.push({zone:'stack',idx:i,el:C[i]})});
  }else{
    S.stacks.forEach((st,i)=>{
      const c=st[st.length-1];
      if(c&&isLocked(c)&&!(src.zone==='stack'&&src.idx===i)){
        const e=document.querySelector(`[data-id="${c.id}"]`);
        if(e)t.push({zone:'lock',idx:i,el:e});
      }
    });
    S.stacks.forEach((d,i)=>{if(colCanAccept(card,i,src))t.push({zone:'stack',idx:i,el:C[i]})});
  }
  return t;
}
function dropError(card,zone,slotIdx){
  if(zone==='found'){
    const f=S.found[slotIdx];
    if(card.type==='joker')return 'Джокер — в уже открытую категорию';
    if(card.type==='key')return 'Ключ нужен запертой карте на столе';
    if(card.type==='gold')return 'Слот занят другой категорией';
    if(!f.length)return 'Сюда сначала нужна золотая карта';
    return 'Это категория «'+DEF.cats[f[0].cat].n+'»';
  }
  const d=S.stacks[slotIdx],dt=d[d.length-1];
  if(card.type==='gold')return 'Золотая карта — только на пустое место';
  if(card.type==='key')return 'Ключ — на замок 🔒 или пустое место';
  if(card.type==='joker')return 'Джокер — в категорию или на пустое место';
  if(dt&&isLocked(dt))return 'Эта карта заперта 🔒';
  if(dt&&dt.type==='gold')return 'На золотую карту класть нельзя';
  if(dt&&(dt.type==='key'||dt.type==='joker'))return 'Класть можно только на слово той же группы';
  return 'Эти слова из разных групп';
}

function doMove(src,dst,count,golden){
  if(busy)return false;
  snapshot();
  const from=srcArr(src);
  const cards=from.splice(from.length-count,count);
  if(dst.zone==='found')S.found[dst.idx].push(...cards);
  else S.stacks[dst.idx].push(...cards);
  normalize();
  S.moves--;
  (golden?sGold:sMove)();haptic();
  renderAll(cards.map(c=>c.id));
  saveGame();
  if(dst.zone==='found'){
    const f=S.found[dst.idx];
    if(f.length===catSize()){completeCategory(dst.idx,f[0].cat);return true}
  }
  setTimeout(checkEnd,80);
  return true;
}
function doUnlock(src,stackIdx){
  if(busy)return false;
  snapshot();
  srcArr(src).pop();
  const lockCard=S.stacks[stackIdx][S.stacks[stackIdx].length-1];
  S.locked=S.locked.filter(id=>id!==lockCard.id);
  normalize();
  S.moves--;
  sKey();haptic(25);
  renderAll([lockCard.id]);
  saveGame();
  toast('🔓 Карта открыта!');
  setTimeout(checkEnd,80);
  return true;
}
function drawCard(){
  if(busy)return;
  if(!S.stock.length&&S.waste.length>1){
    snapshot();
    S.stock=S.waste.reverse();S.waste=[];
    sDraw();renderAll();saveGame();
    setTimeout(checkEnd,80);return;
  }
  if(!S.stock.length){toast('Колода пуста');return}
  snapshot();
  const c=S.stock.pop();c.up=true;S.waste.push(c);
  sDraw();haptic();
  renderAll([c.id]);saveGame();
  setTimeout(checkEnd,80);
}
function normalize(){
  S.stacks.forEach(st=>{if(st.length)st[st.length-1].up=true});
}
function completeCategory(fi,ci){
  busy=true;sDone();haptic(60);
  const slot=$('#topRow').querySelectorAll('.fslot')[fi];
  slot.classList.add('completing');
  const stamp=el('div','stamp','✓ Собрано!');
  slot.appendChild(stamp);requestAnimationFrame(()=>stamp.classList.add('show'));
  setTimeout(()=>{
    S.completed.push(ci);
    S.found[fi]=[];
    busy=false;
    renderAll();saveGame();
    checkEnd();
  },750);
}

function anyMoveExists(){
  if(S.stock.length||S.waste.length>1)return true;
  const lockCount=S.stacks.filter(st=>{const c=st[st.length-1];return c&&isLocked(c)}).length;
  const hasEmpty=S.stacks.some(st=>!st.length);
  const sources=[];
  S.stacks.forEach((st,si)=>{const c=st[st.length-1];if(c&&!isLocked(c))sources.push([c,si])});
  if(S.waste.length)sources.push([S.waste[S.waste.length-1],-1]);
  for(const [c,si] of sources){
    if(c.type==='word'){
      if(openFoundationFor(c.cat)>=0)return true;
      if(S.stacks.some((d,di)=>colCanAccept(c,di,{zone:'stack',idx:si})))return true;
    }else if(c.type==='gold'){
      if(emptyFoundation()>=0)return true;
      if(hasEmpty)return true;
    }else if(c.type==='joker'){
      if(S.found.some(f=>f.length))return true;
      if(S.stacks.some((d,di)=>colCanAccept(c,di,{zone:'stack',idx:si})))return true;
    }else{
      if(lockCount)return true;
      if(S.stacks.some((d,di)=>colCanAccept(c,di,{zone:'stack',idx:si})))return true;
    }
  }
  return false;
}
function checkEnd(){
  if(busy)return;
  if(S.completed.length===DEF.cats.length){winLevel();return}
  if(S.moves<=0){outOfMoves();return}
  if(!anyMoveExists())loseModal('Тупик','Доступных ходов не осталось. Отмени ход или начни заново.');
}
function outOfMoves(){
  if(!S.rescue){
    modal(`<h2>Ходы закончились</h2><p>Но путешествие можно продолжить — один раз за уровень.</p>
      <button class="btn gold" id="mRescue">🎁 +5 ходов (бесплатно)</button>
      <button class="btn" id="mRetry">Начать заново</button>
      <button class="btn ghost" id="mMap">К карте</button>`);
    $('#mRescue').onclick=()=>{hideModal();S.rescue=true;S.moves+=5;sGold();renderAll();saveGame()};
    $('#mRetry').onclick=()=>{hideModal();restartLevel()};
    $('#mMap').onclick=()=>{hideModal();showMap()};
    return;
  }
  loseModal('Ходы закончились','Шагов больше нет, а слова ещё ждут своих категорий.');
}
function winLevel(){
  clearSave();
  const ratio=S.moves/DEF.moves;
  const stars=ratio>=.4?3:ratio>=.15?2:1;
  let extra='';
  if(DAILY){
    const t=todayStr();
    if(!progress.daily)progress.daily={last:'',streak:0};
    if(progress.daily.last!==t){
      const y=new Date(Date.now()-864e5);
      const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
      progress.daily.streak=(progress.daily.last===ys)?progress.daily.streak+1:1;
      progress.daily.last=t;
    }
    extra=`<p>Серия пазлов дня: <b>🔥 ${progress.daily.streak}</b></p>`;
  }else{
    progress.stars[Lidx]=Math.max(progress.stars[Lidx]||0,stars);
    progress.unlocked=Math.max(progress.unlocked,Math.min(Lidx+2,LEVELS.length));
  }
  saveProgress();
  const next=!DAILY&&Lidx+1<LEVELS.length;
  modal(`
    <h2>${DAILY?'Пазл дня пройден!':'Уровень пройден!'}</h2>
    <div class="stars-big">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <p>Осталось ходов: <b>${S.moves}</b> из ${DEF.moves}</p>${extra}
    ${next?'<button class="btn gold" id="mNext">Дальше →</button>':''}
    <button class="btn" id="mReplay">Сыграть ещё раз</button>
    <button class="btn ghost" id="mMap">К карте</button>`);
  sDone();
  if(next)$('#mNext').onclick=()=>{hideModal();initLevel(Lidx+1)};
  $('#mReplay').onclick=()=>{hideModal();restartLevel()};
  $('#mMap').onclick=()=>{hideModal();showMap()};
}
function loseModal(title,text){
  modal(`<h2>${title}</h2><p>${text}</p>
    <button class="btn" id="mRetry">Начать заново</button>
    ${history.length?'<button class="btn gold" id="mUndo">↩ Отменить ход</button>':''}
    <button class="btn ghost" id="mMap">К карте</button>`);
  $('#mRetry').onclick=()=>{hideModal();restartLevel()};
  const u=$('#mUndo');if(u)u.onclick=()=>{hideModal();undo()};
  $('#mMap').onclick=()=>{hideModal();showMap()};
}

/* ===================================================== */
/* ================== DRAG & DROP ====================== */
/* ===================================================== */
let drag=null;
function startDrag(e,src){
  if(busy||drag)return;
  e.preventDefault();
  const arr=srcArr(src);
  if(arr.length&&isLocked(arr[arr.length-1])){
    const top=arr[arr.length-1];
    sBad();haptic(30);toast('🔒 Заперто — найди карту-ключ 🗝');shakeCard(top.id);return;
  }
  const cards=getDragSet(src);if(!cards.length)return;
  const els=cards.map(c=>document.querySelector(`[data-id="${c.id}"]`));
  const rect=els[0].getBoundingClientRect();
  const layer=el('div');layer.id='dragLayer';
  layer.style.width=rect.width+'px';layer.style.height=rect.height+'px';
  els.forEach((s,i)=>{const c=s.cloneNode(true);c.style.top=(i*18)+'px';c.style.visibility='visible';c.style.height=rect.height+'px';layer.appendChild(c)});
  $('#app').appendChild(layer);
  drag={src,cards,els,layer,dx:e.clientX-rect.left,dy:e.clientY-rect.top,
        sx:e.clientX,sy:e.clientY,moved:false,
        targets:computeTargets(cards[0],src),
        show:computeShowTargets(cards[0],src),hot:null};
  els.forEach(s=>s.style.visibility='hidden');
  positionLayer(e);
  window.addEventListener('pointermove',onDragMove);
  window.addEventListener('pointerup',onDragEnd);
  window.addEventListener('pointercancel',onDragEnd);
}
function positionLayer(e){
  const a=$('#app').getBoundingClientRect();
  drag.layer.style.left=(e.clientX-a.left-drag.dx)+'px';
  drag.layer.style.top=(e.clientY-a.top-drag.dy)+'px';
}
function hitTarget(e,targets){
  const pad=6;
  /* приоритет: замки (точечные цели) → фундаменты → колонки */
  const order={lock:0,found:1,stack:2};
  const hits=targets.filter(t=>{
    const r=t.el.getBoundingClientRect();
    return e.clientX>=r.left-pad&&e.clientX<=r.right+pad&&e.clientY>=r.top-pad&&e.clientY<=r.bottom+pad;
  });
  hits.sort((a,b)=>order[a.zone]-order[b.zone]);
  return hits[0];
}
function onDragMove(e){
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>7){
    drag.moved=true;
    drag.show.forEach(t=>t.el.classList.add('drop-ok'));
  }
  positionLayer(e);
  if(drag.moved){
    const hot=hitTarget(e,drag.show);
    if(hot!==drag.hot){
      if(drag.hot)drag.hot.el.classList.remove('drop-hot');
      if(hot)hot.el.classList.add('drop-hot');
      drag.hot=hot;
    }
  }
}
function anySlotUnder(e){
  const zones=[['found',$('#topRow').querySelectorAll('.fslot')],['stack',$('#tableau').children]];
  for(const [zone,coll] of zones){
    for(let i=0;i<coll.length;i++){
      if(!coll[i])continue;
      const r=coll[i].getBoundingClientRect();
      if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)return{zone,idx:i};
    }
  }
  return null;
}
function onDragEnd(e){
  if(!drag)return;
  window.removeEventListener('pointermove',onDragMove);
  window.removeEventListener('pointerup',onDragEnd);
  window.removeEventListener('pointercancel',onDragEnd);
  const d=drag;drag=null;
  d.targets.concat(d.show).forEach(t=>t.el.classList.remove('drop-ok','drop-hot'));
  d.layer.remove();
  const restore=()=>d.els.forEach(s=>s&&(s.style.visibility=''));
  if(!d.moved){
    restore();
    const flash=d.show.length?d.show:d.targets;
    if(flash.length){
      flash.forEach(t=>{t.el.classList.add('drop-flash');setTimeout(()=>t.el.classList.remove('drop-flash'),1200)});
      toast('Перетащи карту в подходящее место');
    }else{toast('Этой карте пока некуда идти');shakeCard(d.cards[0].id)}
    return;
  }
  const tgt=hitTarget(e,d.targets);
  if(tgt){
    if(tgt.zone==='lock')doUnlock(d.src,tgt.idx);
    else doMove(d.src,{zone:tgt.zone,idx:tgt.idx},d.cards.length,d.cards[0].type==='gold'&&tgt.zone==='found');
    return;
  }
  restore();
  const wrong=anySlotUnder(e);
  if(wrong&&!(d.src.zone==='stack'&&wrong.zone==='stack'&&d.src.idx===wrong.idx)){
    sBad();haptic(30);toast(dropError(d.cards[0],wrong.zone,wrong.idx));shakeCard(d.cards[0].id);
  }
}
function shakeCard(id){
  const e=document.querySelector(`[data-id="${id}"]`);
  if(e){e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),320)}
}

/* ===================================================== */
/* =================== ПОДСКАЗКА ======================= */
/* ===================================================== */
function hint(){
  const F=$('#topRow').querySelectorAll('.fslot');
  const C=$('#tableau').children;
  const mark=(id,tEl)=>{
    const e=id?document.querySelector(`[data-id="${id}"]`):null;
    if(e){e.classList.add('hinted');setTimeout(()=>e.classList.remove('hinted'),2100)}
    if(tEl){tEl.classList.add('drop-flash');setTimeout(()=>tEl.classList.remove('drop-flash'),1400)}
  };
  const tops=[];
  S.stacks.forEach((st,si)=>{const c=st[st.length-1];if(c&&!isLocked(c))tops.push([c,si])});
  if(S.waste.length)tops.push([S.waste[S.waste.length-1],-1]);
  /* 1: слово в открытую категорию */
  for(const [c] of tops){if(c.type==='word'&&openFoundationFor(c.cat)>=0){mark(c.id,F[openFoundationFor(c.cat)]);return}}
  /* 2: золото в пустой слот */
  for(const [c] of tops){if(c.type==='gold'&&emptyFoundation()>=0){mark(c.id,F[emptyFoundation()]);return}}
  /* 2.5: джокер в открытую категорию */
  for(const [c] of tops){if(c.type==='joker'){const fi=S.found.findIndex(f=>f.length);if(fi>=0){mark(c.id,F[fi]);return}}}
  /* 3: ключ к замку */
  const lockedCols=S.stacks.map((st,si)=>({st,si})).filter(({st})=>{const c=st[st.length-1];return c&&isLocked(c)});
  if(lockedCols.length){
    const k=tops.find(([c])=>c.type==='key');
    if(k){mark(k[0].id,document.querySelector(`[data-id="${lockedCols[0].st[lockedCols[0].st.length-1].id}"]`));return}
  }
  /* 4: колода */
  if(S.stock.length||S.waste.length>1){
    const sp=$('#stockPile');if(sp){sp.classList.add('hinted');setTimeout(()=>sp.classList.remove('hinted'),2100)}
    toast('Возьми карту из колоды');return;
  }
  /* 5: перенос по столу — копаем под закрытые карты */
  for(const [c,si] of tops){
    const di=S.stacks.findIndex((d,i)=>colCanAccept(c,i,{zone:'stack',idx:si}));
    if(di>=0){mark(c.id,C[di]);return}
  }
  toast('Подсказок нет — попробуй отменить ход');
}

/* ===================================================== */
/* ==================== РЕНДЕР ========================= */
/* ===================================================== */
function cardEl(c,faceUp,opts){
  opts=opts||{};
  const d=el('div','card '+(faceUp?(c.type==='gold'?'gold':c.type==='key'?'key':c.type==='joker'?'joker':'word'):'back'));
  d.dataset.id=c.id;
  if(faceUp){
    if(c.type==='word'&&DEF.strips){const s=el('div','strip');s.style.background=CAT_COLORS[c.cat%CAT_COLORS.length];d.appendChild(s)}
    if(c.em)d.appendChild(el('div','em',c.em));
    d.appendChild(el('div','tx',c.text));
    if(opts.under)d.classList.add('under');
    if(isLocked(c)){d.classList.add('lockedc');d.appendChild(el('div','lockov','🔒'))}
  }else{
    if(c.type==='key')d.appendChild(el('div','badge','🗝'));
    else if(c.type==='joker')d.appendChild(el('div','badge','🃏'));
    else if(isLocked(c))d.appendChild(el('div','badge','🔒'));
    if(opts.thin)d.classList.add('thin');
  }
  if(opts.tappable)d.classList.add('tappable');
  return d;
}
function renderAll(landedIds){
  landedIds=landedIds||[];
  $('#movesLeft').textContent=S.moves;
  $('#movesPill').classList.toggle('low',S.moves<=8);
  $('#btnUndo').disabled=!history.length;

  /* верхний ряд */
  const T=$('#topRow');T.innerHTML='';
  S.found.forEach(f=>{
    const slot=el('div','fslot');
    if(!f.length){
      slot.appendChild(el('div','empty-hint','<div class="e">🃏</div>золотая<br>карта'));
    }else{
      const ci=f[0].cat,cat=DEF.cats[ci];
      slot.appendChild(el('div','tab',cat.n));
      const area=el('div','cardArea');
      const topCard=f[f.length-1];
      const show=topCard.type==='gold'
        ?cardEl(topCard,true,{})
        :cardEl(topCard,true,{});
      if(landedIds.includes(topCard.id))flipMark(show);
      area.appendChild(show);
      slot.appendChild(area);
      slot.appendChild(el('div','prog',`${f.length-1}/${DEF.wpc}`));
      if(f.length===catSize()-1)slot.classList.add('full-soon');
      slot.style.borderStyle='solid';slot.style.borderColor='rgba(242,193,78,.45)';
    }
    T.appendChild(slot);
  });
  if(DEF.stock.length){
    /* сброс */
    const wcell=el('div','pile');wcell.style.cursor='default';
    wcell.appendChild(el('div','zl','Сброс'));
    if(S.waste.length){
      const c=S.waste[S.waste.length-1];
      const area=el('div','pcard');
      const cd=cardEl(c,true,{tappable:true});
      if(landedIds.includes(c.id))flipMark(cd);
      cd.addEventListener('pointerdown',ev=>startDrag(ev,{zone:'waste',idx:0}));
      area.appendChild(cd);wcell.appendChild(area);
      if(S.waste.length>1)wcell.appendChild(el('div','cnt',S.waste.length));
    }
    T.appendChild(wcell);
    /* колода */
    const scell=el('div','pile');scell.id='stockPile';
    scell.appendChild(el('div','zl','Колода'));
    if(S.stock.length){
      const area=el('div','pcard');
      area.appendChild(cardEl({id:'_stk',type:'word'},false));
      scell.appendChild(area);
      scell.appendChild(el('div','cnt',S.stock.length));
    }else if(S.waste.length>1){
      scell.appendChild(el('div','recyc','↻<span>заново</span>'));
    }else{
      scell.appendChild(el('div','recyc','·<span>пусто</span>'));
    }
    scell.addEventListener('pointerdown',ev=>{ev.preventDefault();drawCard()});
    T.appendChild(scell);
  }

  /* стол */
  const TB=$('#tableau');TB.innerHTML='';
  const colH=TB.clientHeight||300;
  const ch=parseInt(getComputedStyle($('#app')).getPropertyValue('--ch'))||82;
  S.stacks.forEach((st,si)=>{
    const col=el('div','tcol');
    if(!st.length){
      col.appendChild(el('div','tplace'));
    }else{
      const n=st.length;
      let downStep=8,upStep=Math.round(ch*0.3);
      const upCount=st.filter(c=>c.up).length, downCount=n-upCount;
      const need=()=>downCount*downStep+Math.max(0,upCount-1)*upStep+ch;
      while(need()>colH-4&&upStep>13)upStep--;
      while(need()>colH-4&&downStep>4)downStep--;
      /* серия одной категории сверху — тянется целиком */
      let runStart=n;
      const top=st[n-1];
      if(top&&!isLocked(top)){
        if(top.type==='word'){runStart=n;while(runStart>0&&st[runStart-1].type==='word'&&st[runStart-1].cat===top.cat&&!S.locked.includes(st[runStart-1].id))runStart--}
        else runStart=n-1;
      }
      let y=0;
      st.forEach((c,i)=>{
        const isTop=i===n-1;
        const inRun=i>=runStart;
        const cd=cardEl(c,!!c.up,{under:c.up&&!isTop,thin:!c.up&&!isTop,tappable:inRun});
        cd.style.top=y+'px';cd.style.zIndex=i;
        y+=c.up?upStep:downStep;
        if(isTop&&landedIds.includes(c.id))flipMark(cd);
        if(inRun)cd.addEventListener('pointerdown',ev=>startDrag(ev,{zone:'stack',idx:si}));
        else if(isTop&&isLocked(c))cd.addEventListener('pointerdown',ev=>startDrag(ev,{zone:'stack',idx:si}));
        col.appendChild(cd);
      });
    }
    TB.appendChild(col);
  });
}
function flipMark(cd){
  cd.style.transition='none';cd.style.transform='scale(.55)';
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{cd.style.transition='';cd.style.transform=''})});
}

function showScreen(name){

  $('#gameScreen').classList.toggle('hidden',name!=='game');
}
async function showMap(){

  }else rb.style.display='none';

function renderDaily(){
  const d=$('#dailyCard');
  const t=todayStr();
  const dd=progress.daily||{last:'',streak:0};
  const done=dd.last===t;
  d.innerHTML=`<div><div class="dc-t">📅 Пазл дня</div><div class="dc-d">${t.slice(8)}.${t.slice(5,7)} · серия 🔥 ${dd.streak||0}</div></div>
    <button class="dc-btn${done?' done':''}">${done?'✓ Пройден':'Играть'}</button>`;
  d.querySelector('.dc-btn').onclick=()=>{clearSave();initDaily()};
}
function renderMap(){
  const P=$('#path');P.innerHTML='';
  const n=LEVELS.length,rowH=92,banH=54,nodeH=64;
  const totalH=n*rowH+CHAPTERS.length*banH+20;
  P.style.height=totalH+'px';
  const yOf=i=>{const c=Math.floor(i/10);return totalH-(i+1)*rowH-(c+1)*banH+14};
  const pts=LEVELS.map((_,i)=>{const x=i%2===0?52:164;return[x+32,yOf(i)+32]});
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 280 ${totalH}`);
  let d=`M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){const[x1,y1]=pts[i-1],[x2,y2]=pts[i];d+=` C ${x1} ${(y1+y2)/2}, ${x2} ${(y1+y2)/2}, ${x2} ${y2}`}
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',d);path.setAttribute('fill','none');
  path.setAttribute('stroke','rgba(242,193,78,.35)');path.setAttribute('stroke-width','4');
  path.setAttribute('stroke-dasharray','2 9');path.setAttribute('stroke-linecap','round');
  svg.appendChild(path);P.appendChild(svg);
  /* баннеры глав */
  CHAPTERS.forEach((chp,c)=>{
    const b=el('div','chapter-banner',`${chp.e} Глава ${c+1} · ${chp.n}`);
    b.style.top=(totalH-c*10*rowH-(c+1)*banH+8)+'px';
    P.appendChild(b);
  });
  /* уровни */
  LEVELS.forEach((lv,i)=>{
    const locked=i+1>progress.unlocked;
    const node=el('div','node'+(locked?' locked':''));
    node.style.left=(i%2===0?52:164)+'px';
    node.style.top=yOf(i)+'px';
    const st=progress.stars[i]||0;
    node.innerHTML=locked?'🔒':`${i+1}<div class="stars">${lv.boss?'👑 ':''}${'★'.repeat(st)||'·'}</div>`;
    if(!locked)node.addEventListener('pointerdown',()=>{
      if(i===0&&!progress.stars[0]&&!progress._tut)showTutorial(i);
      else{clearSave();initLevel(i)}
    });
    P.appendChild(node);
  });
  $('#soundBtn').textContent=progress.sound===false?'🔇':'🔊';
}
function showTutorial(i){
  progress._tut=true;saveProgress();
  modal(`
    <h2>Как играть</h2>
    <div class="tut">
      <div class="row"><div class="n">1</div><div>Перетащи <b>золотую карту</b> наверх — она откроет категорию. Разгадай, какие слова с ней связаны!</div></div>
      <div class="row"><div class="n">2</div><div>На столе слово ложится <b>только на слово своей группы</b> или на пустое место. Не сходится — значит, это разные категории!</div></div>
      <div class="row"><div class="n">3</div><div>Тап по <b>колоде</b> — взять карту. Карты с 🔒 открываются картой-ключом 🗝 (ключи видны даже на рубашках!).</div></div>
      <div class="row"><div class="n">👣</div><div>Каждое действие — один ход. Уложись в лимит. Простое касание карты подсветит её ходы.</div></div>
    </div>
    <button class="btn gold" id="mGo">В путь!</button>`);
  $('#mGo').onclick=()=>{hideModal();initLevel(i)};
}
function modal(html){$('#modalBox').innerHTML=html;$('#overlay').classList.add('show')}
function hideModal(){$('#overlay').classList.remove('show')}
let toastT=null;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);
}

$('#btnHome').addEventListener('pointerdown',()=>showMap());
$('#btnUndo').addEventListener('pointerdown',()=>undo());
$('#btnHint').addEventListener('pointerdown',()=>hint());
$('#btnRestart').addEventListener('pointerdown',()=>{
  modal(`<h2>Начать уровень заново?</h2><p>Будет собрана новая раскладка.</p>
    <button class="btn" id="mYes">Да, заново</button><button class="btn ghost" id="mNo">Отмена</button>`);
  $('#mYes').onclick=()=>{hideModal();restartLevel()};
  $('#mNo').onclick=hideModal;
});
$('#soundBtn').addEventListener('pointerdown',()=>{
  progress.sound=progress.sound===false?true:false;
  saveProgress();
  $('#soundBtn').textContent=progress.sound===false?'🔇':'🔊';
  if(progress.sound!==false)beep(660,.08);
});
$('#statsBtn').addEventListener('pointerdown',()=>{
  const passed=Object.keys(progress.stars).filter(k=>k>=0).length;
  const stars=Object.entries(progress.stars).filter(([k])=>k>=0).reduce((a,[,v])=>a+v,0);
  const dd=progress.daily||{streak:0,last:''};
  let chDone='';
  CHAPTERS.forEach((chp,c)=>{
    const got=LEVELS.filter((lv,i)=>lv.ch===c&&progress.stars[i]).length;
    chDone+=`${chp.e} ${chp.n}: <b>${got}/10</b><br>`;
  });
  modal(`<h2>📊 Статистика</h2>
    <p>Пройдено уровней: <b>${passed} / ${LEVELS.length}</b><br>
    Звёзды: <b>⭐ ${stars} / ${LEVELS.length*3}</b><br>
    Серия пазлов дня: <b>🔥 ${dd.streak||0}</b></p>
    <p style="text-align:left">${chDone}</p>
    <button class="btn" id="mOk">Ок</button>`);
  $('#mOk').onclick=hideModal;
});
function refit(){
  fitLayout();
  if(!$('#gameScreen').classList.contains('hidden')&&S)renderAll();
}
window.addEventListener('resize',refit);
window.addEventListener('orientationchange',()=>setTimeout(refit,120));

(async()=>{await loadProgress();fitLayout();showMap()})();
</script>
</body>
</html>
